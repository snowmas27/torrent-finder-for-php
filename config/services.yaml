# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
  providers:
    animetosho:
      name: "animetosho"
      searchUrl: "https://feed.animetosho.org/rss2?q=%s"
      class: TorrentFinder\Provider\Animetosho
    nyaa:
      name: "nyaa"
      searchUrl: "https://nyaa.si/?f=0&c=1_0&q=%s&s=seeders&o=desc"
      class: TorrentFinder\Provider\Nyaa
    limetorrents:
      name: "limetorrents"
      searchUrl: "https://www.limetorrents.fun/search/all/%s/"
      class: TorrentFinder\Provider\LimeTorrents
    thepiratebay:
      name: "thepiratebay"
      # JSON API behind thepiratebay.org; cat=200 = Video
      searchUrl: "https://apibay.org/q.php?q=%s&cat=200"
      class: TorrentFinder\Provider\ThePirateBay
    torlock:
      name: "torlock"
      searchUrl: "https://www.torlock.com/all/torrents/%s.html?sort=seeds"
      class: TorrentFinder\Provider\GenericProvider
    # Sites scraped by the universal GenericProvider
    rutor:
      name: "rutor"
      searchUrl: "http://rutor.info/search/0/0/000/2/%s"
      class: TorrentFinder\Provider\GenericProvider
    bitsearch:
      name: "bitsearch"
      searchUrl: "https://bitsearch.eu/search?q=%s&sort=seeders"
      class: TorrentFinder\Provider\GenericProvider
    therarbg:
      name: "therarbg"
      searchUrl: "https://therarbg.com/get-posts/keywords:%s/"
      class: TorrentFinder\Provider\GenericProvider
    torrentdownload:
      name: "torrentdownload"
      searchUrl: "https://www.torrentdownload.info/feed?q=%s"
      class: TorrentFinder\Provider\GenericProvider
    torrentdownloads:
      name: "torrentdownloads"
      searchUrl: "https://www.torrentdownloads.pro/rss.xml?type=search&search=%s"
      class: TorrentFinder\Provider\GenericProvider
    bt4g:
      name: "bt4g"
      searchUrl: "https://bt4gprx.com/search?q=%s&page=rss"
      class: TorrentFinder\Provider\GenericProvider
services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  TorrentFinder\:
    resource: "../src/*"
    exclude: "../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}"

  TorrentFinder\Provider\ProvidersConfiguration:
    arguments:
      $providers: "%providers%"

  TorrentFinder\Search\SearchOnProviders:
    arguments:
      $providersConfigurations: '@TorrentFinder\Provider\ProvidersConfiguration'

  TorrentFinder\Provider\Jackett\JackettUrlBuilder:
    arguments:
      $host: "%env(resolve:JACKETT_HOST)%"
      $port: "%env(resolve:JACKETT_PORT)%"
      $apikey: "%env(resolve:JACKETT_APIKEY)%"
